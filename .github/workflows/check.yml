name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check publication contents
        run: python tools/verify_package.py --tracked
      - name: Syntax
        run: python -m compileall -q tools Applio tests
      - name: UI test dependencies (no GPU runtime)
        run: python -m pip install gradio==6.20.0 numpy==2.4.6 soundfile==0.14.0
      - name: Regression checks
        run: python -m unittest discover -s tests -v
