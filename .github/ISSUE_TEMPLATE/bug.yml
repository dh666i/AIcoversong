name: 问题反馈 / Bug report
description: 报告安装、界面或本地处理问题
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: 发生了什么 / What happened?
      description: 写出操作步骤、预期和实际结果。请不要上传私人录音、模型或未授权歌曲。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      placeholder: Windows 版本、显卡/显存、驱动、Python/uv版本、仓库commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 粘贴相关错误，先删除个人路径、文件名与密钥。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已经移除了密钥、个人录音、模型和未授权的音乐内容。
          required: true
